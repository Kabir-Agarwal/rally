{% extends "base.html" %}
{% block content %}
<div class="sec-title">Account</div>
<div class="card" id="accountCard"></div>

<div class="card">
  <div style="font-weight:800">This group</div>
  <div class="bignum">{{ g.code }}</div>
  <div class="note">Anyone with this code can watch. Signed-in members can score.</div>
</div>

<div class="sec-title">Your groups</div>
<div id="groupRows" class="card" style="padding:6px 6px"></div>

<div class="card">
  <div style="font-weight:800;margin-bottom:6px">+ Create a group</div>
  <div class="row"><input id="newGroupName" placeholder="group name"><button class="btn sm" onclick="createGroup()">Create</button></div>
  <div id="createOut" class="note"></div>
  <div id="codeShareBox" style="display:none"><div class="muted" style="margin-top:6px">Share this code:</div>
    <div class="bignum" id="codeShare"></div></div>
  <div style="font-weight:800;margin:12px 0 6px">+ Join another group</div>
  <div class="row"><input id="joinCode2" maxlength="6" placeholder="code" style="text-transform:uppercase"><button class="btn sm clay" onclick="joinGroup()">Join</button></div>
  <div id="joinOut2" class="err"></div>
</div>
<script>window.PAGE="groups";</script>
{% endblock %}
