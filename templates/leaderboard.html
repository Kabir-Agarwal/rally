{% extends "base.html" %}
{% block content %}
<div class="row" style="margin:12px 16px 0">
  <input id="rankSearch" placeholder="Search players…" oninput="renderRanks()">
  <button class="btn sm ghost" style="flex:0 0 auto;width:auto" onclick="toggleFunnel('rankFunnel')">▼</button>
</div>
<div id="rankFunnel" class="funnel" style="display:none">
  <div class="funnelrow"><span class="funnellab">Mode</span>
    <span class="seg small"><button class="on" onclick="setRankOpt('mode','singles',this)">Singles</button>
      <button onclick="setRankOpt('mode','doubles',this)">Doubles</button></span></div>
  <div class="funnelrow"><span class="funnellab">Who</span>
    <span class="seg small"><button class="on" onclick="setRankOpt('scope','group',this)">This group</button>
      <button onclick="setRankOpt('scope','everyone',this)">Everyone</button></span></div>
</div>
<div id="youCard"></div>
<div id="rankList" class="card" style="padding:2px 2px"><div class="empty">Loading…</div></div>
<div id="provWrap"></div>
<script>window.PAGE="leaderboard";</script>
{% endblock %}
